<title>NIGHTSHIFT — 开放世界赛车</title>
<style>
:root{--ink:#ecf2ed;--muted:#9aa9a3;--yellow:#ffd84d;--cyan:#62e2f2}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101d1c;color:var(--ink);font-family:Arial,"Microsoft YaHei",sans-serif}button{font:inherit}.game{position:relative;width:100vw;height:100vh;overflow:hidden;user-select:none}canvas{position:absolute;inset:0;width:100%;height:100%;outline:0}.game:after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at center,transparent 42%,rgba(3,8,10,.5) 110%)}
.top{position:absolute;z-index:2;inset:0 0 auto;padding:27px 34px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none}.brand{display:flex;gap:12px;align-items:center}.mark{width:38px;height:38px;display:grid;place-items:center;background:var(--yellow);color:#111;font-weight:900;font-size:22px;transform:skew(-8deg);box-shadow:5px 5px #0005}.brand b{display:block;letter-spacing:.14em;font-size:17px}.brand small{display:block;color:var(--muted);letter-spacing:.22em;font:700 8px monospace;margin-top:3px}.district{background:#091018a8;border:1px solid #fff2;border-radius:30px;padding:10px 18px;font:800 11px monospace;letter-spacing:.12em;backdrop-filter:blur(12px)}.district span{color:#7f918b;margin-right:10px}.rep{text-align:right;font:800 19px monospace;text-shadow:0 2px 8px #000}.rep span{display:block;color:var(--yellow);font-size:9px;letter-spacing:.18em;margin-bottom:5px}
.mission{position:absolute;z-index:2;left:34px;top:104px;width:286px;padding:19px 20px 17px;background:linear-gradient(145deg,#0d1619eb,#0d1619ad);border:1px solid #fff2;border-left:3px solid var(--yellow);box-shadow:0 18px 45px #0004}.eyebrow{color:var(--yellow);font:800 9px monospace;letter-spacing:.2em}.eyebrow i{display:inline-block;width:6px;height:6px;margin-right:8px;border-radius:50%;background:#ff5964;box-shadow:0 0 9px #ff5964}.mission h1{margin:10px 0 7px;font-size:23px}.mission p{color:#acb8b4;margin:0 0 16px;font-size:11px;line-height:1.55}.row{display:flex;justify-content:space-between;font:800 11px monospace}.row b{color:var(--yellow);font-size:19px}.track{height:3px;margin-top:9px;background:#fff2}.track i{display:block;height:100%;width:0;background:var(--yellow);box-shadow:0 0 8px var(--yellow);transition:.15s}

.start,.pause{position:absolute;z-index:4;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;text-shadow:0 5px 24px #000}.start{transition:.45s}.start.hide{opacity:0;transform:translate(-50%,-45%);pointer-events:none}.start span,.pause span{color:var(--yellow);font:800 10px monospace;letter-spacing:.25em}.start h2,.pause h2{margin:12px 0 23px;font:900 clamp(27px,4vw,52px)/1 Arial;letter-spacing:-.035em}.start h2{width:min(780px,82vw)}kbd{padding:4px 7px;border:1px solid #fff4;border-bottom-width:2px;border-radius:3px;background:#070c0eb8}.start kbd{padding:12px 16px;background:var(--yellow);color:#111;border:0;font-size:18px}.start em{margin-left:8px;font:800 11px monospace;font-style:normal;letter-spacing:.1em}.pause{display:none;padding:50px 70px;width:min(520px,90vw);background:#060b0eed;border:1px solid #fff2}.pause.show{display:block}.pause p{color:#9daba7;font:700 11px monospace}.controls{position:absolute;z-index:2;left:50%;bottom:22px;transform:translateX(-50%);display:flex;gap:20px;white-space:nowrap;color:#81918d;font:700 9px monospace;letter-spacing:.08em}.touch{display:flex;position:absolute;z-index:5;inset:auto 16px 18px;justify-content:space-between;pointer-events:none}.touch div{display:flex;gap:8px;align-items:end;pointer-events:auto}.touch button{width:52px;height:52px;border-radius:50%;border:1px solid #fff4;background:#080f12b8;color:#fff;font-weight:900;touch-action:none}.touch button:first-child{color:var(--cyan)}
@media(max-width:720px){.top{padding:17px}.district,.controls{display:none}.brand b{font-size:14px}.mission{left:16px;top:81px;width:220px;padding:14px}.mission p{display:none}.heat{right:16px;top:84px}.minimap{left:16px;bottom:115px;width:104px;height:104px}.speedo{right:17px;bottom:116px;width:155px}.speed{font-size:50px}.touch{display:flex;position:absolute;z-index:5;inset:auto 16px 18px;justify-content:space-between}.touch div{display:flex;gap:8px;align-items:end}.touch button{width:58px;height:58px;border-radius:50%;border:1px solid #fff4;background:#080f12b8;color:#fff;font-weight:900;touch-action:none}.touch button:first-child{color:var(--cyan)}}
</style>
</head><body><main class="game"><canvas id="c" tabindex="0" aria-label="NIGHTSHIFT 开放世界驾驶游戏"></canvas>
<header class="top"><div class="brand"><div class="mark">N</div><div><b>NIGHTSHIFT</b><small>OPEN CITY DRIVER</small></div></div><div class="district"><span>当前位置</span><b id="district">CENTRAL LOOP</b></div><div class="rep"><span>REP</span><b id="score">0</b></div></header>
<section class="mission"><div class="eyebrow"><i></i>LIVE EVENT</div><h1>午夜环城赛</h1><p>沿黄色信标穿越城市，在时间归零前完成一圈。</p><div class="row"><span id="cp">01 / 08</span><b id="time">76s</b></div><div class="track"><i id="progress"></i></div></section><aside class="heat"><span>追缺热度</span><div id="heat">◇ ◇ ◇ ◇ ◇</div></aside><div class="toast" id="toast">午夜环城赛 · 冲向黄色信标</div><aside class="minimap"><div class="grid"></div><b class="north">N</b></aside><section class="speedo"><div class="speed"><b id="speed">0</b><small>KM/H</small></div><div class="nitro"><span>NITRO</span><b id="nitro">100%</b></div><div class="nitroTrack"><i id="nitrobar" style="width:100%"></i></div></section>
<div class="start" id="start"><span>城市已解锁</span><h2>踩下油门，今晚由你接管</h2><div><kbd>W</kbd><em>开始驾驶</em></div></div><div class="pause" id="pause"><span>PAUSED</span><h2>夜色在等你</h2><p>按 P 或 ESC 返回街头</p></div><footer class="controls"><span><kbd>WASD</kbd> 驾驶</span><span><kbd>SPACE</kbd> 漂移</span><span><kbd>SHIFT</kbd> 氮气</span><span><kbd>P</kbd> 暂停</span></footer><div class="touch"><div><button data-k="a">←</button><button data-k="d">→</button></div><div><button data-k="shift">N₂O</button><button data-k="w">↑</button><button data-k="s">↓</button></div></div></main>
<script>
const c=document.querySelector('#c'),x=c.getContext('2d'),ui=Object.fromEntries([...document.querySelectorAll('[id]')].map(el=>[el.id,el])),K={},W=5600,G=420,R=146,route=[[2940,2940],[3360,2940],[3780,2520],[4200,2100],[4620,2520],[4620,3360],[4200,3780],[3360,3780]],p={x:2940,y:3360,a:-1.57,vx:0,vy:0,n:100,heat:0,score:0,cp:0,t:76,started:false,paused:false,msg:'午夜环城赛 · 冲向黄色信标',ml:4},traffic=Array.from({length:24},(_,i)=>({x:(i%2?i*577:((i*3)%10)*G),y:(i%2?((i*3)%10)*G:i*431),a:i%2?0:1.57,s:70+i%5*12,col:['#ec6a54','#72c6db','#ece0bc','#9a84e8','#66b36e'][i%5]}));let last=performance.now();function resize(){let d=Math.min(devicePixelRatio,2);c.width=innerWidth*d;c.height=innerHeight*d;x.setTransform(d,0,0,d,0,0)}resize();addEventListener('resize',resize);
function road(v){let m=((v%G)+G)%G;return Math.min(m,G-m)}function building(a,b){return road(a)>R/2+18&&road(b)>R/2+18}function toast(s,l=1.8){p.msg=s;p.ml=l}function car(a,b,ang,col,me=false){x.save();x.translate(a,b);x.rotate(ang);x.fillStyle='#0008';x.fillRect(-20,-10,43,23);x.translate(0,-2);x.fillStyle=col;x.fillRect(-22,-11,44,22);x.fillStyle='#101820';x.fillRect(-8,-8,18,16);x.fillStyle='#ffdf8a';x.fillRect(19,-7,3,5);x.fillRect(19,2,3,5);if(me){x.shadowColor='#52e5ff';x.shadowBlur=14}x.restore()}
function update(d){if(p.paused)return;p.ml-=d;let f=Math.cos(p.a),g=Math.sin(p.a),sp=p.vx*f+p.vy*g,side=-p.vx*g+p.vy*f,on=road(p.x)<R/2||road(p.y)<R/2,dr=K[' ']&&Math.abs(sp)>65,boost=K.shift&&K.w&&p.n>0&&sp>40;if(K.w){p.vx+=f*(boost?350:230)*d;p.vy+=g*(boost?350:230)*d;p.started=true}if(K.s){p.vx-=f*390*d;p.vy-=g*390*d}let st=(K.d?1:0)-(K.a?1:0);if(st&&Math.abs(sp)>3)p.a+=st*(dr?2.25:1.55)*Math.min(1,Math.abs(sp)/75)*d*Math.sign(sp||1);side*=Math.pow(dr?.965:on?.83:.9,d*60);sp*=Math.pow(on?.992:.972,d*60);sp=Math.max(-90,Math.min(boost?360:on?265:135,sp));p.vx=f*sp-g*side;p.vy=g*sp+f*side;if(boost)p.n=Math.max(0,p.n-28*d);else p.n=Math.min(100,p.n+(dr?12:3.2)*d);let ox=p.x,oy=p.y;p.x+=p.vx*d;p.y+=p.vy*d;if(building(p.x,p.y)||p.x<45||p.y<45||p.x>W-45||p.y>W-45){p.x=ox;p.y=oy;p.vx*=-.28;p.vy*=-.28;p.heat=Math.min(5,p.heat+.22);toast('撞击！连击中断')}p.heat=Math.max(0,Math.min(5,p.heat+(Math.abs(sp)>220?.055:-.035)*d));if(p.started){p.t-=d;if(p.t<=0){p.cp=0;p.t=76;p.x=2940;p.y=3360;toast('新一轮：午夜环城赛',2.4)}}let q=route[p.cp];if(Math.hypot(p.x-q[0],p.y-q[1])<78){p.score+=600+Math.round(p.t*12);p.cp++;p.n=Math.min(100,p.n+26);if(p.cp===route.length){p.score+=4000;toast('环城赛完成！+4,000 REP',3);p.cp=0;p.t=76}else toast('检查点通过！',1)}}
function draw(){let sw=innerWidth,sh=innerHeight,cx=p.x-sw/2,cy=p.y-sh/2;x.fillStyle='#132a27';x.fillRect(0,0,sw,sh);x.save();x.translate(-cx,-cy);let sx=Math.floor(cx/G)-1,ex=Math.ceil((cx+sw)/G)+1,sy=Math.floor(cy/G)-1,ey=Math.ceil((cy+sh)/G)+1;x.fillStyle='#222b31';for(let i=sx;i<=ex;i++)x.fillRect(i*G-R/2,0,R,W);for(let i=sy;i<=ey;i++)x.fillRect(0,i*G-R/2,W,R);x.strokeStyle='#ece0bc38';x.lineWidth=2;x.setLineDash([18,19]);for(let i=sx;i<=ex;i++){x.beginPath();x.moveTo(i*G,0);x.lineTo(i*G,W);x.stroke()}for(let i=sy;i<=ey;i++){x.beginPath();x.moveTo(0,i*G);x.lineTo(W,i*G);x.stroke()}x.setLineDash([]);for(let i=sx;i<ex;i++)for(let j=sy;j<ey;j++){x.fillStyle='#20292f';x.fillRect(i*G+R/2+19,j*G+R/2+19,G-R-38,G-R-38)}let q=route[p.cp];x.strokeStyle='#ffda45';x.lineWidth=7;x.shadowColor='#ffda45';x.shadowBlur=24;x.beginPath();x.arc(q[0],q[1],54,0,7);x.stroke();x.shadowBlur=0;traffic.forEach(z=>{z.x+=Math.cos(z.a)*z.s/60;z.y+=Math.sin(z.a)*z.s/60;if(z.x<0||z.x>W||z.y<0||z.y>W)z.a+=Math.PI;car(z.x,z.y,z.a,z.col)});car(p.x,p.y,p.a,'#f2c84b',true);x.restore();x.fillStyle='#070c2348';x.fillRect(0,0,sw,sh)}
function hud(){ui.speed.textContent=Math.round(Math.hypot(p.vx,p.vy)*.82);ui.nitro.textContent=Math.round(p.n)+'%';ui.nitrobar.style.width=p.n+'%';ui.score.textContent=Math.round(p.score).toLocaleString();ui.time.textContent=Math.ceil(p.t)+'s';ui.cp.textContent=String(p.cp+1).padStart(2,'0')+' / '+route.length;ui.progress.style.width=p.cp/route.length*100+'%';ui.heat.innerHTML=[0,1,2,3,4].map(i=>`<i class="${p.heat>i+.35?'hot':''}">◇</i>`).join('');toastEl.textContent=p.ml>0?p.msg:'';ui.start.classList.toggle('hide',p.started);ui.pause.classList.toggle('show',p.paused);ui.district.textContent=p.y<2100?'NEON HEIGHTS':p.y>3900?'SOUTH COAST':'CENTRAL LOOP'}
const toastEl=document.querySelector('#toast');function loop(t){let d=Math.min(.035,(t-last)/1000);last=t;update(d);draw();hud();requestAnimationFrame(loop)}requestAnimationFrame(loop);function key(e,on){let k=e.key.toLowerCase();if(['w','a','s','d',' ','shift','p','escape'].includes(k))e.preventDefault();if((k==='p'||k==='escape')&&on&&!e.repeat){p.paused=!p.paused;toast(p.paused?'游戏暂停':'重新上路')}else K[k]=on}addEventListener('keydown',e=>key(e,true));addEventListener('keyup',e=>key(e,false));document.querySelectorAll('[data-k]').forEach(b=>{let k=b.dataset.k;b.onpointerdown=e=>{e.preventDefault();K[k]=true;p.started=true};['pointerup','pointerleave','pointercancel'].forEach(n=>b.addEventListener(n,()=>K[k]=false))});c.onclick=()=>c.focus();
document.addEventListener('keydown',e=>{const m={KeyW:'w',KeyA:'a',KeyS:'s',KeyD:'d',Space:' ',ShiftLeft:'shift',ShiftRight:'shift',KeyP:'p',Escape:'escape'},k=m[e.code];if(!k)return;e.preventDefault();e.stopImmediatePropagation();if((k==='p'||k==='escape')&&!e.repeat){p.paused=!p.paused;toast(p.paused?'PAUSED':'GO!')}else{K[k]=true;p.started=true;if(!e.repeat){if(k==='w'){p.vx+=Math.cos(p.a)*58;p.vy+=Math.sin(p.a)*58}if(k==='s'){p.vx-=Math.cos(p.a)*34;p.vy-=Math.sin(p.a)*34}if(k==='a')p.a-=.045;if(k==='d')p.a+=.045}}},true);document.addEventListener('keyup',e=>{const m={KeyW:'w',KeyA:'a',KeyS:'s',KeyD:'d',Space:' ',ShiftLeft:'shift',ShiftRight:'shift'},k=m[e.code];if(!k)return;e.preventDefault();e.stopImmediatePropagation();K[k]=false},true);function arm(){c.focus({preventScroll:true});p.started=true;toast('GO!',1)}c.addEventListener('pointerdown',arm);ui.start.addEventListener('pointerdown',arm);c.focus({preventScroll:true});
</script></body></html>
